<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Questionnaire{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #64748b;
      --line: #d9e2ec;
      --panel: #ffffff;
      --paper: #f6f8fb;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --danger: #b42318;
      --focus: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    a { color: var(--brand-dark); }
    .shell {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 16px 0 24px;
    }
    .brand {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--brand-dark);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: clamp(18px, 3vw, 32px);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    }
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      line-height: 1.12;
      margin: 0 0 12px;
      letter-spacing: 0;
    }
    h2 {
      font-size: 1.25rem;
      margin: 0 0 8px;
      letter-spacing: 0;
    }
    .muted { color: var(--muted); }
    .intro {
      white-space: pre-line;
      max-width: 78ch;
      color: #334155;
    }
    .progress {
      margin: 18px 0 28px;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress span {
      display: block;
      height: 100%;
      background: var(--brand);
    }
    .question {
      padding: 20px 0;
      border-top: 1px solid var(--line);
    }
    .question:first-of-type { border-top: 0; }
    .question label.prompt {
      display: block;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .help {
      color: var(--muted);
      font-size: 0.95rem;
      margin: -4px 0 12px;
      white-space: pre-line;
    }
    input[type="text"], input[type="number"], input[type="email"], input[type="tel"], input[type="date"], textarea, select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      min-height: 44px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 112px; resize: vertical; }
    input:focus, textarea:focus {
      outline: 3px solid rgba(245, 158, 11, 0.28);
      border-color: var(--focus);
    }
    .choices {
      display: grid;
      gap: 10px;
    }
    .choice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfdff;
    }
    .choice input {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid var(--brand);
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }
    .button.secondary {
      background: #fff;
      color: var(--brand-dark);
      border-color: var(--line);
    }
    .error {
      color: var(--danger);
      font-weight: 700;
      margin-top: 8px;
    }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      margin-top: 20px;
    }
    .item {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }
    .item-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    @media (max-width: 640px) {
      .shell { width: min(100% - 20px, 1040px); padding-top: 12px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .panel { padding: 18px; }
      .actions .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand">myHCL TND</div>
      {% block topbar %}{% endblock %}
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
